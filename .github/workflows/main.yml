name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Extract Android project
        run: |
          unzip -q bikis_numerology_android_project_photo_icon.zip -d android-source
          test -f android-source/biki_android_project/settings.gradle
          test -d android-source/biki_android_project/app

      - name: Build APK
        run: gradle --no-daemon -p android-source/biki_android_project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bikis-numerology-apk
          path: android-source/biki_android_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
